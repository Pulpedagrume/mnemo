name: Problème d’import IA / AI import problem
description: Un fichier produit par une IA ne s’importe pas comme prévu. / An AI-generated file does not import as expected.
labels: [import, ai]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ces informations nous permettent de reproduire le problème.
        **Retirez toute donnée personnelle ou tout contenu protégé** avant de joindre un fichier.
  - type: dropdown
    id: format
    attributes:
      label: Format du fichier / File format
      options: [Markdown, YAML, JSON, CSV, .zip, .apkg, Texte collé / pasted text]
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Fichier ou extrait / File or excerpt
      description: Joignez le fichier ou collez la partie qui pose problème (dans un bloc de code).
      render: markdown
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Rapport d’import / Import report
      description: Dans l’aperçu, cliquez sur « Rapport (texte) » et collez son contenu, ou lancez `mnemo validate fichier --json`.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu / Expected result
    validations:
      required: true
  - type: input
    id: prompt
    attributes:
      label: Tâche et format du prompt utilisé / Prompt task and format
      placeholder: ex. course-pack, markdown, fr
  - type: input
    id: version
    attributes:
      label: Version de Mnemo / Mnemo version
